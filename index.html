<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PokiClash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header class="game-hud">
      <div class="score-box red-side">
        <span>RIVAL</span>
        <strong id="red-crowns">0</strong>
      </div>
      <div class="timer-box">
        <span id="match-timer">03:00</span>
      </div>
      <div class="score-box blue-side">
        <span>TÚ</span>
        <strong id="blue-crowns">0</strong>
      </div>
    </header>

    <div class="canvas-wrap">
      <canvas id="arena-canvas" width="400" height="660"></canvas>
    </div>

    <footer class="controls-hud">
      <div class="elixir-container">
        <span class="elixir-icon">💧</span>
        <div class="elixir-bar-track">
          <div id="elixir-bar-fill" class="elixir-bar-fill"></div>
        </div>
        <strong id="elixir-count">5</strong>
      </div>

      <div class="hand-container">
        <div class="card-hand" id="card-hand"></div>
        <div class="next-card-slot">
          <span>SIG.</span>
          <img id="next-card-img" src="" alt="Siguiente">
        </div>
      </div>
    </footer>
  </main>

  <div id="result-modal" class="modal-backdrop" hidden>
    <div class="modal-box">
      <h2 id="modal-title">¡VICTORIA!</h2>
      <p id="modal-score">Coronas: 1 - 0</p>
      <button id="modal-restart-btn" class="clash-btn">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
